<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/index.css">
    <title>TODO Step 1</title>
</head>

<body class="container">
    <header>
        <h1>Todo app</h1>
    </header>

    <main>
        <form id="todoForm">
            <div class="mb-3">
                <label for="todoInput" class="form-label">Todo input</label>
                <input type="text" class="form-control" id="todoInput" aria-describedby="todoInputHelp">
                <div id="todoInputHelp" class="form-text">Write your todo in the input field</div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <p>Number of todos = <span id="numberOfTodos">0</span></p>

        <section id="todoListView">
            <ul class="list-group" id="todoList">

            </ul>
        </section>

        <section id="todoDetailView" class="d-none">

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script/index.js"></script>
</body>

</html>
