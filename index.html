<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/index.css">
    <title>JS1 - Väderapp</title>
</head>

<body class="container">
    <header>
        <h1>Väderapp</h1>
    </header>

    <main>
        <form id="cityWeatherForm">
            <label for="cityWeatherInput">Skriv in en stad</label>
            <input type="text" id="cityWeatherInput" placeholder="Sök på en stad t.ex. Malmö">
            <button type="submit">Hämta väder</button>
        </form>

        <section id="weatherContainer"></section>
    </main>

    <script type="module" src="script/index.js"></script>
</body>

</html>
